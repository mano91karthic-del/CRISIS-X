# CRISIS-X Render Blueprint
# Reproducible infrastructure as code for Render deployment.
# Usage: Import this file in the Render Dashboard or use `render blueprint apply`.

services:
  # FastAPI Web Service (native Python runtime)
  - type: web
    name: crisis-x-api
    runtime: python
    rootDir: apps/api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: crisis-x-db
          property: connectionString
      - key: DATA_STORAGE_ROOT
        value: /tmp/crisisx
      - key: CORS_ORIGINS
        sync: false
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: AI_PROVIDER_MODEL
        sync: false

databases:
  - name: crisis-x-db
    databaseName: crisisx
    user: crisisx
    plan: free
